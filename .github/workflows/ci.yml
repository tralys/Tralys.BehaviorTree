name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Package version; empty packs the project's default
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "VERSION_ARGS=-p:Version=$VERSION" >> "$GITHUB_ENV"
          fi

      - run: dotnet restore Tralys.BehaviorTree.slnx

      - run: dotnet build Tralys.BehaviorTree.slnx -c Release --no-restore $VERSION_ARGS

      - run: dotnet run --project tests/Tralys.BehaviorTree.Tests/Tralys.BehaviorTree.Tests.csproj -c Release --no-build

      - run: dotnet pack src/Tralys.BehaviorTree/Tralys.BehaviorTree.csproj -c Release --no-build $VERSION_ARGS -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          retention-days: 7
